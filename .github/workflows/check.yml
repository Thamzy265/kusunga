name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: ./tool/check.sh
      - run: flutter build macos --debug
      - name: Swift tests (clipboard watcher, quit flow, paste flow)
        run: xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug -destination 'platform=macOS' -only-testing:RunnerTests CODE_SIGN_IDENTITY=-
      - name: C++ tests (Windows clipboard and picker policy, built on the Mac runner)
        run: ./tool/test_windows_policy.sh
      - name: Swift typed-shortcut core tests, compiled as Release (no DEBUG)
        run: ./tool/test_mac_shortcuts_release.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: ./tool/check.ps1
        shell: pwsh
      # Runs even when the tests fail, so one run shows both; the job still
      # fails if they did.
      - run: flutter build windows --debug
        if: ${{ !cancelled() }}
      # The PM runs this build before merge (PM decision 2026-11-25). The whole
      # folder: the exe needs its DLLs and data/. Not after a failed build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ success() }}
        with:
          name: kusunga-windows-debug-${{ github.sha }}
          path: build/windows/x64/runner/Debug/
          retention-days: 3
          if-no-files-found: error
